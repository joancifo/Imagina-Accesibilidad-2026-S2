<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2.14 · Enlace para saltar al contenido · Sesión 2</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #1b2228; max-width: 760px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
    h1 { font-size: 22px; }
    .caso { border: 1px solid #58676f; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .caso h2 { font-size: 16px; margin-top: 0; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #0622bc; background: #fff; color: #0622bc; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .saltar { position: absolute; left: 16px; top: -100px; background: #0725d0; color: #fff; padding: 8px 16px; border-radius: 6px; }
    .saltar:focus { top: 8px; }
    main:focus { outline: none; }   /* el destino recibe foco por programa; no necesita anillo */
  </style>
</head>
<body>
  <h1>2.14 · Enlace para saltar al contenido</h1>
  <a class="saltar" href="#contenido">Saltar al contenido principal</a>

  <header>
    <nav aria-label="Menú principal">
      <a href="#">Canal de denuncias</a> · <a href="#">Mis fichajes</a> · <a href="#">Mis ausencias</a>
      · <a href="#">Mi perfil</a> · <a href="#">Ayuda</a>
    </nav>
  </header>

  <main id="contenido" tabindex="-1">
    <h2>Canal de denuncias</h2>
    <p>Pulsa Tab nada más cargar la página: el primer elemento es el enlace para saltar.</p>
    <a href="#">Reporta una denuncia</a>
  </main>

</body>
</html>
