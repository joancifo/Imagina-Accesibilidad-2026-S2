<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2.9 · Avisos que se anuncian solos · Sesión 2</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #1b2228; max-width: 760px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
    h1 { font-size: 22px; }
    .caso { border: 1px solid #58676f; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .caso h2 { font-size: 16px; margin-top: 0; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #0622bc; background: #fff; color: #0622bc; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    #estado:not(:empty) { background: #d2f9e2; padding: 8px 12px; border-radius: 6px; }
    #alerta:not(:empty) { background: #fde2e2; padding: 8px 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>2.9 · Avisos que se anuncian solos</h1>
    <!-- ✅ Las regiones existen y están vacías desde que carga la página -->
    <div id="estado" role="status"></div>
    <div id="alerta" role="alert"></div>

    <button type="button" onclick="guardar()">Guardar borrador</button>
    <button type="button" onclick="fallar()">Simular error de conexión</button>

    <div class="caso">
      <h2>❌ Región creada a la vez que el mensaje</h2>
      <button type="button" onclick="guardarMal()">Guardar (versión mala)</button>
      <p>Prueba los tres botones con NVDA, VoiceOver o el Narrador encendido.</p>
    </div>
  </main>

  <script>
    function guardar() {
      const hora = new Date().toLocaleTimeString('es-ES');
      // Cambiar solo el texto. La hora hace que el mensaje sea distinto cada vez
      document.getElementById('estado').textContent = 'Borrador guardado a las ' + hora + '.';
    }
    function fallar() {
      document.getElementById('alerta').textContent =
        'No se ha podido enviar la denuncia. Revisa tu conexión e inténtalo de nuevo.';
    }
    function guardarMal() {
      document.body.insertAdjacentHTML('beforeend', '<div role="status">Borrador guardado.</div>');
    }
  </script>
</body>
</html>
