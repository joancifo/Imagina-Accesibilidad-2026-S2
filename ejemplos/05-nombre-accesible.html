<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2.7 · ¿Quién gana? El cálculo del nombre accesible · Sesión 2</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #1b2228; max-width: 760px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
    h1 { font-size: 22px; }
    .caso { border: 1px solid #58676f; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .caso h2 { font-size: 16px; margin-top: 0; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #0622bc; background: #fff; color: #0622bc; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <main>
    <h1>2.7 · ¿Quién gana? El cálculo del nombre accesible</h1>
    <div class="caso">
      <h2>Tres fuentes de nombre en el mismo campo</h2>
      <p id="t-contacto">Teléfono de contacto</p>
      <label for="tel">Teléfono</label>
      <input id="tel" type="tel" aria-label="Móvil" aria-labelledby="t-contacto">
      <p>Mira el panel Accessibility → Name. Gana <code>aria-labelledby</code>: «Teléfono de contacto».</p>
    </div>

    <div class="caso">
      <h2>WCAG 2.5.3 · Etiqueta en el nombre</h2>
      <!-- ❌ Quien usa control por voz dice «pulsa Siguiente»… y no funciona -->
      <button type="button" aria-label="Continuar al paso 2">Siguiente</button>
      <!-- ✅ El nombre empieza por el texto visible -->
      <button type="button" aria-label="Siguiente: paso 2, describe tu denuncia">Siguiente</button>
    </div>
  </main>

</body>
</html>
