<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2.10 – 2.11 · Anatomía de un campo accesible · Sesión 2</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #1b2228; max-width: 760px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
    h1 { font-size: 22px; }
    .caso { border: 1px solid #58676f; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .caso h2 { font-size: 16px; margin-top: 0; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #0622bc; background: #fff; color: #0622bc; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    label { display: block; font-weight: 600; }
    .ayuda { margin: 2px 0 4px; color: #46545b; font-size: 14px; }
    input { height: 36px; padding: 0 10px; border: 1px solid #58676f; border-radius: 6px; font-size: 15px; }
    input[aria-invalid="true"] { border: 2px solid #b00020; }
    .error { color: #b00020; margin: 4px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>2.10 – 2.11 · Anatomía de un campo accesible</h1>
    <div class="caso">
      <!-- 1 etiqueta · 2 ayuda · 3 control · 4 error -->
      <label for="tel">Teléfono <span aria-hidden="true">*</span></label>
      <p id="tel-ayuda" class="ayuda">9 dígitos, sin espacios. Ejemplo: 600000000</p>
      <input id="tel" type="tel" autocomplete="tel" required
             aria-describedby="tel-ayuda tel-error" aria-invalid="true" value="600 00">
      <p id="tel-error" class="error">⚠ Introduce un teléfono de 9 dígitos.</p>
    </div>

    <div class="caso">
      <h2>❌ El placeholder no es una etiqueta</h2>
      <input type="email" placeholder="Email">
      <p>Desaparece al escribir, suele tener poco contraste y no todos los lectores lo leen igual.</p>
    </div>
  </main>

</body>
</html>
