<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2.13 · Cuando el CSS desordena el foco · Sesión 2</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #1b2228; max-width: 760px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
    h1 { font-size: 22px; }
    .caso { border: 1px solid #58676f; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .caso h2 { font-size: 16px; margin-top: 0; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #0622bc; background: #fff; color: #0622bc; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .acciones { display: flex; gap: 8px; }
    .mal { flex-direction: row-reverse; justify-content: flex-start; }
    .bien { justify-content: flex-end; }
  </style>
</head>
<body>
  <main>
    <h1>2.13 · Cuando el CSS desordena el foco</h1>
    <div class="caso">
      <h2>❌ flex-direction: row-reverse</h2>
      <div class="acciones mal">
        <button type="submit">Siguiente</button>
        <button type="button">Atrás</button>
        <button type="button">Cancelar</button>
      </div>
    </div>

    <div class="caso">
      <h2>✅ El orden del código es el orden visual</h2>
      <div class="acciones bien">
        <button type="button">Cancelar</button>
        <button type="button">Atrás</button>
        <button type="submit">Siguiente</button>
      </div>
    </div>
  </main>

</body>
</html>
