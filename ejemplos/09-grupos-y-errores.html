<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2.10 – 2.11 · Grupos de opciones y errores al enviar · Sesión 2</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #1b2228; max-width: 760px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
    h1 { font-size: 22px; }
    .caso { border: 1px solid #58676f; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .caso h2 { font-size: 16px; margin-top: 0; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #0622bc; background: #fff; color: #0622bc; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    fieldset { border: 1px solid #58676f; border-radius: 6px; margin-bottom: 8px; }
    legend { font-weight: 600; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <main>
    <h1>2.10 – 2.11 · Grupos de opciones y errores al enviar</h1>
    <form id="frecuencia-form" novalidate>
      <fieldset>
        <legend>¿Los hechos se han producido antes? <span aria-hidden="true">*</span></legend>
        <input type="radio" id="f-primera" name="frecuencia" value="primera" required>
        <label for="f-primera">Es la primera vez</label><br>
        <input type="radio" id="f-varias" name="frecuencia" value="varias">
        <label for="f-varias">Ha ocurrido varias veces</label><br>
        <input type="radio" id="f-continua" name="frecuencia" value="continua">
        <label for="f-continua">Ocurre de forma continuada</label>
      </fieldset>
      <p id="frecuencia-error" class="error" hidden>⚠ Elige una opción.</p>
      <button type="submit">Siguiente</button>
    </form>
  </main>

  <script>
    document.getElementById('frecuencia-form').addEventListener('submit', (evento) => {
      evento.preventDefault();
      const elegida = document.querySelector('input[name=frecuencia]:checked');
      const error = document.getElementById('frecuencia-error');
      const radios = document.querySelectorAll('input[name=frecuencia]');
      error.hidden = Boolean(elegida);
      radios.forEach((radio) => {
        if (elegida) {
          radio.removeAttribute('aria-invalid');
          radio.removeAttribute('aria-describedby');
        } else {
          radio.setAttribute('aria-invalid', 'true');
          radio.setAttribute('aria-describedby', 'frecuencia-error');
        }
      });
      if (!elegida) radios[0].focus();   // el foco va al primer control con error
    });
  </script>
</body>
</html>
