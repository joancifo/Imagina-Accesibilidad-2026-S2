<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva · Un acordeón accesible con button y aria-expanded · Sesión 2</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #1b2228; max-width: 760px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
    h1 { font-size: 22px; }
    .caso { border: 1px solid #58676f; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .caso h2 { font-size: 16px; margin-top: 0; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #0622bc; background: #fff; color: #0622bc; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .acordeon { width: 100%; text-align: left; font-size: 18px; font-weight: 700; }
    .acordeon::after { content: " +"; }
    .acordeon[aria-expanded="true"]::after { content: " −"; }
  </style>
</head>
<body>
  <main>
    <h1>Reserva · Un acordeón accesible con button y aria-expanded</h1>
    <h2>
      <button type="button" class="acordeon" aria-expanded="false" aria-controls="panel-quien">
        ¿Quién puede denunciar?
      </button>
    </h2>
    <div id="panel-quien" hidden>
      <p>Cualquier persona que trabaje o haya trabajado en la empresa, y también proveedores y clientes.</p>
    </div>

    <h2>
      <button type="button" class="acordeon" aria-expanded="false" aria-controls="panel-que">
        ¿Qué puedo denunciar?
      </button>
    </h2>
    <div id="panel-que" hidden>
      <p>Acoso laboral, robo o hurto, conducta indebida y agresión.</p>
    </div>
  </main>

  <script>
    document.querySelectorAll('.acordeon').forEach((boton) => {
      boton.addEventListener('click', () => {
        const abierto = boton.getAttribute('aria-expanded') === 'true';
        boton.setAttribute('aria-expanded', String(!abierto));
        document.getElementById(boton.getAttribute('aria-controls')).hidden = abierto;
      });
    });
  </script>
</body>
</html>
